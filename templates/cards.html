<div class="update-grid">
  {% for u in cards %}
  <a class="update-card" href="{{ base }}projects/{{ u.slug }}/">
    <img src="{{ base }}{{ u.image }}" alt="{{ u.title }}">
    <div class="update-card-body">
      <time>{{ u.date }}</time>
      <strong>{{ u.title }}</strong>
      <p>{{ u[text_key] }}</p>
    </div>
  </a>
  {% endfor %}
</div>
